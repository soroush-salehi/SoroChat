<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SoroChat</title><style>body{font:15px system-ui;background:#f4f6fb;color:#182238;margin:0}.app{max-width:900px;height:100vh;margin:auto;background:white;display:flex;flex-direction:column}header{padding:20px;border-bottom:1px solid #e5eaf2;font-weight:bold}.feed{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:12px}.msg{padding:12px 16px;background:#eef2fa;border-radius:14px;max-width:70%;align-self:flex-start}.mine{align-self:flex-end;background:#e4ebff}form{display:flex;padding:16px;gap:10px;border-top:1px solid #e5eaf2}input{flex:1;padding:13px;border:1px solid #dce2ed;border-radius:10px}button{background:#4169f5;color:white;border:0;border-radius:10px;padding:12px 18px}</style>
<style id="soro-polish">
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{--accent:#4f91ff;--accent-soft:color-mix(in srgb,var(--accent) 13%,transparent);--ink:#edf2ff;--muted:#98a6c2;--line:#27334d;--bg:#080d19;--card:#101a2b;--glow:color-mix(in srgb,var(--accent) 30%,transparent)}

body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.16;background-image:linear-gradient(#91a8d10d 1px,transparent 1px),linear-gradient(90deg,#91a8d10d 1px,transparent 1px);background-size:38px 38px;mask-image:linear-gradient(to bottom,black,transparent 90%)}

p{line-height:1.7}button,.upload,.pill{transition:transform .22s ease,border-color .22s ease,background .22s ease,box-shadow .22s ease}

.panel,.window,.msg,.bubble,.file,.person,.composer{box-shadow:0 14px 40px #0002!important}
.panel,.file,.window{background:linear-gradient(145deg,#121f34ee,#0e1728ee)!important;backdrop-filter:blur(14px)}
.muted,small,.eyebrow,footer{color:#94a3bf!important}

</style><script id="soro-motion">(()=>{const nodes='section,.panel,.stat,.tasks,.file,.window,.person,.hero,canvas'.split(',').flatMap(s=>[...document.querySelectorAll(s)]);const unique=[...new Set(nodes)].filter(n=>!n.closest('.side'));if(!('IntersectionObserver'in window)){unique.forEach(n=>n.classList.add('visible'));return}const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target)}}),{threshold:.08});unique.forEach(n=>{n.classList.add('reveal');io.observe(n)});})();</script><div class="app"><header>◈ SoroChat <small style="float:right;color:#778">Offline prototype</small></header><main class="feed" id="feed"><div class="msg">Welcome to SoroChat. This is a local messaging interface demo.</div></main><form id="form"><input id="text" placeholder="Write a message…" required><button>Send</button></form></div><script>document.querySelector('#form').onsubmit=e=>{e.preventDefault();let v=document.querySelector('#text'),m=document.createElement('div');m.className='msg mine';m.textContent=v.value.trim();if(!m.textContent)return;document.querySelector('#feed').append(m);v.value='';document.querySelector('#feed').scrollTop=999999}</script>
