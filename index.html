<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SoroChat</title><style>body{font:15px system-ui;background:#f4f6fb;color:#182238;margin:0}.app{max-width:900px;height:100vh;margin:auto;background:white;display:flex;flex-direction:column}header{padding:20px;border-bottom:1px solid #e5eaf2;font-weight:bold}.feed{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:12px}.msg{padding:12px 16px;background:#eef2fa;border-radius:14px;max-width:70%;align-self:flex-start}.mine{align-self:flex-end;background:#e4ebff}form{display:flex;padding:16px;gap:10px;border-top:1px solid #e5eaf2}input{flex:1;padding:13px;border:1px solid #dce2ed;border-radius:10px}button{background:#4169f5;color:white;border:0;border-radius:10px;padding:12px 18px}</style><div class="app"><header>◈ SoroChat <small style="float:right;color:#778">Offline prototype</small></header><main class="feed" id="feed"><div class="msg">Welcome to SoroChat. This is a local messaging interface demo.</div></main><form id="form"><input id="text" placeholder="Write a message…" required><button>Send</button></form></div><script>document.querySelector('#form').onsubmit=e=>{e.preventDefault();let v=document.querySelector('#text'),m=document.createElement('div');m.className='msg mine';m.textContent=v.value.trim();if(!m.textContent)return;document.querySelector('#feed').append(m);v.value='';document.querySelector('#feed').scrollTop=999999}</script>
